name: IG Publisher QA on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    uses: Inera-AB/fhir-ig-workflows/.github/workflows/pr-qa.yml@v1
    # An R5 IG validates against the R5 terminology server.
    with:
      tx-server: https://tx.fhir.org/r5
