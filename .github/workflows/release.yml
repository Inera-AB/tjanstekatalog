name: Publish release

# Publishes a release with IG Publisher's publication mode. A release tag
# (no "v" prefix: 1.2.0, 1.2.0-rc1) publishes to fhir.inera.se; a manual run
# on a branch publishes to the test web root. The workflow itself lives in
# Inera-AB/fhir-ig-workflows.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: Inera-AB/fhir-ig-workflows/.github/workflows/release.yml@v1
    # An R5 IG validates against the R5 terminology server, in both the
    # build and the publication run.
    with:
      tx-server: https://tx.fhir.org/r5
      # IG Publisher 3.0.5 writes each page's section label to the template
      # as a JSON list, so every <h2> is numbered ["9"] instead of 9 (seen in
      # the 0.2.0 publication). 3.0.4 is the last version known to render it
      # right. Go back to latest once a fixed release is out.
      publisher-version: 3.0.4
    secrets: inherit
